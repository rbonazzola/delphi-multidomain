# Attention scheme presets
#
# Each entry defines a named configuration with:
#   description : human-readable summary
#   domains     : comma-separated list of domains to pass to --domains
#                 (padding is injected automatically and should not be listed)
#   scheme      : attention scheme string to pass to --attention_scheme
#
# Usage:
#   python train.py --attention_scheme <name> --domains <domains from entry> ...


# ── Clinical only ──────────────────────────────────────────────────────────────

base:
  description: Clinical domains only, fully causal
  domains: diseases,death,lifestyle,sex
  scheme: "all:causal(mask_ties=True)"

base_pcs:
  description: Clinical domains + genetic PCs; PCs and sex form a bidirectional block
  domains: diseases,death,lifestyle,genetic_pcs,sex
  scheme: "[genetic_pcs,sex]:bidirectional,all:causal(mask_ties=True)"

base_with_pcs:
  description: Clinical domains + genetic PCs; PCs, lifestyle and sex form a bidirectional block
  domains: diseases,death,lifestyle,genetic_pcs,sex
  scheme: "[genetic_pcs,lifestyle,sex]:bidirectional,all:causal(mask_ties=True)"


# ── HLA ────────────────────────────────────────────────────────────────────────

hla_no_self_attention:
  description: HLA + clinical domains, fully causal
  domains: diseases,death,lifestyle,hla_alleles,sex
  scheme: "all:causal(mask_ties=True)"

hla_bidirectional:
  description: HLA + sex form a bidirectional block; clinical domains causal
  domains: diseases,death,lifestyle,hla_alleles,sex
  scheme: "[hla_alleles,sex]:bidirectional,all:causal(mask_ties=True)"

hla_no_self_attention_pcs:
  description: HLA + genetic PCs + clinical; PCs and sex bidirectional, HLA causal (no self-attention among HLA tokens)
  domains: diseases,death,lifestyle,hla_alleles,genetic_pcs,sex
  scheme: "[genetic_pcs,sex]:bidirectional,all:causal(mask_ties=True)"

hla_bidirectional_pcs:
  description: HLA + genetic PCs + sex form a bidirectional block; clinical domains causal
  domains: diseases,death,lifestyle,hla_alleles,genetic_pcs,sex
  scheme: "[hla_alleles,sex,genetic_pcs]:bidirectional,all:causal(mask_ties=True)"

hla_pcs_causal:
  description: HLA + genetic PCs + clinical; PCs/lifestyle/sex bidirectional, HLA causal
  domains: diseases,death,lifestyle,hla_alleles,genetic_pcs,sex
  scheme: "[genetic_pcs,lifestyle,sex]:bidirectional,all:causal(mask_ties=True)"

hla_pcs_bidirectional:
  description: HLA + genetic PCs + clinical; HLA/sex/PCs/lifestyle all bidirectional
  domains: diseases,death,lifestyle,hla_alleles,genetic_pcs,sex
  scheme: "[hla_alleles,sex,genetic_pcs,lifestyle]:bidirectional,all:causal(mask_ties=True)"


# ── Drugs ──────────────────────────────────────────────────────────────────────

cv_drugs_causal:
  description: Clinical + cardiovascular drugs, fully causal
  domains: diseases,death,cv_drugs,lifestyle,sex
  scheme: "all:causal(mask_ties=True)"

cns_drugs_causal:
  description: Clinical + CNS drugs, fully causal
  domains: diseases,death,ns_drugs,lifestyle,sex
  scheme: "all:causal(mask_ties=True)"

cv_cns_drugs_causal:
  description: Clinical + cardiovascular and CNS drugs, fully causal
  domains: diseases,death,cv_drugs,ns_drugs,lifestyle,sex
  scheme: "all:causal(mask_ties=True)"

cv_cns_drugs_hla_bidirectional:
  description: Clinical + CV and CNS drugs + HLA; HLA/sex bidirectional, rest causal
  domains: diseases,death,cv_drugs,ns_drugs,hla_alleles,lifestyle,sex
  scheme: "[hla_alleles,sex]:bidirectional,all:causal(mask_ties=True)"
