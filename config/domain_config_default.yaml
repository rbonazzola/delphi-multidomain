diseases:
  projector: embed
  path: diseases
  predict: true
  no_repeat: true
  dropout_mode: token
  dropout_rate: 0.1
  group: core

death:
  projector: embed
  path: death
  predict: true
  group: core

sex:
  projector: embed
  path: sex
  at_birth: true
  group: core

lifestyle:
  projector: embed
  path: lifestyle
  dropout_mode: token
  dropout_rate: 0.1
  age_jitter: true
  age_jitter_min: -7300   # -20 years in days
  age_jitter_max: 14610   # +40 years in days
  group: core

cv_drugs:
  projector: embed
  path: cv_drugs
  predict: true
  group: drugs

ns_drugs:
  projector: embed
  path: ns_drugs
  predict: true
  group: drugs


hla_alleles:
  projector: embed
  path: hla_alleles
  at_birth: true
  # group: hla
  # dropout_mode: block   # drop the entire HLA block with probability dropout_rate
  # dropout_rate: 0.1

genetic_pcs:
  type: continuous
  projector: linear
  path: genetic_pcs
  at_birth: true
  input_size: 40
  n_latent_tokens: 5

rare_variants:
  projector: embed
  path: rare_variants
  at_birth: true

